name: Project automation

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, converted_to_draft, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Criar/verificar labels e campos do Project
        required: true
        type: boolean
        default: true
      issue_number:
        description: Número opcional de uma Issue para sincronizar
        required: false
        type: string
      status:
        description: Status opcional para a Issue informada
        required: true
        type: choice
        default: Keep
        options:
          - Keep
          - Backlog
          - In Progress
          - Review
          - Done

concurrency:
  group: sistema-mr-project-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  synchronize:
    name: Synchronize Issues with Project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_OWNER: geanCarneiro
      PROJECT_NUMBER: "2"
      MANUAL_BOOTSTRAP: ${{ inputs.bootstrap || 'false' }}
      MANUAL_ISSUE_NUMBER: ${{ inputs.issue_number || '' }}
      MANUAL_STATUS: ${{ inputs.status || 'Keep' }}

    steps:
      - name: Verify Project token
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        shell: bash
        run: |
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "::error::Configure o repository secret PROJECT_TOKEN antes de executar esta automação."
            exit 1
          fi

      # pull_request_target exposes secrets. Always load automation code from the
      # trusted default branch, never from the pull request branch.
      - name: Check out trusted automation code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Synchronize repository and Project
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const automation = require('./.github/scripts/project-automation.js');
            await automation({ github, context, core });
