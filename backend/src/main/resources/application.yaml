spring:
  application:
    name: sistema-mr
      
  ai:
#    chat:
#      client:
#        observations:
#          # Inclui o texto exato do Prompt enviado nos logs/mecanismos de observabilidade
#          include-prompt-content: true
#          # Inclui o texto exato da resposta (Completion) nos logs/mecanismos de observabilidade
#          include-completion-content: true
    
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: gemini-embedding-2
            dimensions: 768
        chat:
          model: gemini-3.1-flash-lite
          temperature: 0.3
          google-search-retrieval: false
          include-thoughts: false
          thinking-level: LOW
   
  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: neo4j
      password: ${PASSWD_NEO4J}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB

#logging:
#  level:
#    # Ativa o log do Advisor básico de logs
#    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
#    
