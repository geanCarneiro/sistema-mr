jwt:
  secret: ${JWT_SECRET}

google:
  client-id: ${GOOGLE_API_CLIENT_ID}

python:
  runner:
    url: ${PYTHON_RUNNER_URL:http://localhost:8081}

app:
  ai:
    runtime:
      default-route: gemini-chat
      limits:
        max-steps: 8
        max-model-invocations: 8
        max-tool-calls: 8
        max-duration-seconds: 90
        max-context-tokens: 200000
        max-output-tokens: 8192
      routes:
        - id: gemini-chat
          provider: google-gemini
          model: gemini-3.1-flash-lite
          enabled: true
          input-token-limit: 1048576
          output-token-limit: 65536
          capabilities:
            function-calling: true
            structured-output: true
            thinking: true
          quota:
            requests-per-minute: 15
            input-tokens-per-minute: 250000
            requests-per-day: 500
        - id: gemma-local
          provider: local-ai
          model: gemma-3-4b-it-q4
          enabled: true
          input-token-limit: 8192
          output-token-limit: 2048
          capabilities:
            function-calling: true
            structured-output: true
            thinking: false
          quota: {}
      scheduler:
        storage-path: ${AGENT_RUN_SCHEDULER_PATH:./data/agent-runs}
        retry-delay-millis: ${AGENT_RUN_SCHEDULER_RETRY_DELAY_MILLIS:1000}
    document-vision:
      model: gemini-3.1-flash-lite
      temperature: 0.0
      thinking-level: LOW
      max-output-tokens: 8192
    local:
      service-url: ${LOCAL_AI_SERVICE_URL:http://127.0.0.1:8083}
      model: ${LOCAL_AI_CHAT_MODEL:gemma-3-4b-it-q4}
      connect-timeout-seconds: 2
      read-timeout-seconds: ${LOCAL_AI_READ_TIMEOUT_SECONDS:180}
      decision-max-tokens: 256
      vision-max-tokens: 2048
  documents:
    storage-root: ${FILE_STORAGE_ROOT:./data/files}
    max-files-per-upload: 10
    max-file-size-bytes: 20971520
    chunk-size: 800
    max-chunks: 1000
    embedding-batch-size: 20
    embedding-model: multilingual-e5-small
    embedding-dimensions: 384
    embedding-service-url: ${DOCUMENT_EMBEDDING_SERVICE_URL:http://127.0.0.1:8083}
    retrieval-candidates: 100
    retrieval-file-limit: 3
    retrieval-chunk-limit: 12
    retrieval-neighbor-window: 1
    retrieval-full-context-max-tokens: 12000
    context-response-reserve-tokens: 8192
    context-tool-reserve-tokens: 4096
    similarity-threshold: 0.60
    context-token-budget: 200000
    ocr:
      service-url: ${OCR_SERVICE_URL:http://127.0.0.1:8082}
      timeout-seconds: 120
      minimum-text-characters: 12
      minimum-mean-confidence: 0.55
    privacy:
      mapping-encryption-key: ${DOCUMENT_MAPPING_ENCRYPTION_KEY}
