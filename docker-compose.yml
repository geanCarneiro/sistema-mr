version: '0.1'

services:
  # --------------------------------------------------------
  # 1. Banco de Dados Neo4j (Grafo + Vetores)
  # --------------------------------------------------------
  neo4j:
    image: neo4j:5.26.0-community
    container_name: neo4j
    ports:
      - "7474:7474" # Interface Web (Neo4j Browser)
      - "7687:7687" # Porta Bolt (Conexão Spring Boot)
    environment:
      - NEO4J_AUTH=neo4j/${PASSWD_NEO4J}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------
  # 2. Backend Spring Boot (Java 21)
  # --------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - PASSWD_NEO4J=${PASSWD_NEO4J}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_CLIENT_ID=${GOOGLE_API_CLIENT_ID}
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------
  # 3. Frontend Angular 18 (Nginx)
  # --------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    environment:
      - GOOGLE_API_CLIENT_ID: ${GOOGLE_API_CLIENT_ID}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs: