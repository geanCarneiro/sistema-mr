services:
  # --------------------------------------------------------
  # 1. Banco de Dados Neo4j (Grafo + Vetores)
  # --------------------------------------------------------
  neo4j:
    image: neo4j:5.26.0-community
    container_name: neo4j
    ports:
      - "7474:7474" # Interface Web (Neo4j Browser)
      - "7687:7687" # Porta Bolt (Conexão Spring Boot)
    environment:
      - NEO4J_AUTH=neo4j/${PASSWD_NEO4J}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - application

  # --------------------------------------------------------
  # 2. Backend Spring Boot (Java 21)
  # --------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      PASSWD_NEO4J: ${PASSWD_NEO4J}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_API_CLIENT_ID: ${GOOGLE_API_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      DOCUMENT_MAPPING_ENCRYPTION_KEY: ${DOCUMENT_MAPPING_ENCRYPTION_KEY}
      PYTHON_RUNNER_URL: http://python-runner:8081
      OCR_SERVICE_URL: http://ocr-service:8082
      DOCUMENT_EMBEDDING_SERVICE_URL: http://local-ai-service:8083
      LOCAL_AI_SERVICE_URL: http://local-ai-service:8083
      FILE_STORAGE_ROOT: /app/data/files
    volumes:
      # Mantém o armazenamento documental compartilhado com a execução local
      # do backend durante o desenvolvimento.
      - ./backend/data/files:/app/data/files
    depends_on:
      neo4j:
        condition: service_healthy
      python-runner:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
      local-ai-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - application
      - runner
      - ocr

  # --------------------------------------------------------
  # 3. Frontend Angular (Nginx)
  # --------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    environment:
      GOOGLE_API_CLIENT_ID: ${GOOGLE_API_CLIENT_ID}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - application

  # --------------------------------------------------------
  # 4. Runner Python isolado para ferramentas da IA
  # --------------------------------------------------------
  python-runner:
    build:
      context: ./python-runner
      dockerfile: Dockerfile
    container_name: python-runner
    ports:
      - "127.0.0.1:8081:8081"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,nosuid,size=1m
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - runner

  # --------------------------------------------------------
  # 5. OCR neural local para imagens e PDFs digitalizados
  # --------------------------------------------------------
  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: ocr-service
    ports:
      - "127.0.0.1:8082:8082"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - ocr

  # --------------------------------------------------------
  # 6. IA local CPU: embeddings, decisão e visão com Gemma 3 4B IT
  # --------------------------------------------------------
  local-ai-service:
    build:
      context: ./local-ai-service
      dockerfile: Dockerfile
    container_name: local-ai-service
    ports:
      - "127.0.0.1:8083:8083"
    init: true
    read_only: true
    volumes:
      - local_ai_models:/models
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /opt/local-ai:rw,noexec,nosuid,size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 6g
    cpus: 4.0
    environment:
      EMBEDDING_MODEL: intfloat/multilingual-e5-small
      EMBEDDING_MODEL_CACHE: /models
      EMBEDDING_DEVICE: cpu
      LOCAL_CHAT_MODEL_PATH: /models/gemma-3-4b-it-q4_0.gguf
      LOCAL_CHAT_MODEL_NAME: gemma-3-4b-it-q4
      LOCAL_CHAT_CONTEXT_SIZE: 8192
      LOCAL_CHAT_THREADS: 4
      LOCAL_CHAT_FORMAT: gemma-3
      LOCAL_VISION_PROJECTOR_PATH: /models/mmproj-model-f16.gguf
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      TOKENIZERS_PARALLELISM: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - application

volumes:
  neo4j_data:
  neo4j_logs:
  local_ai_models:

networks:
  application:
  runner:
  ocr:
