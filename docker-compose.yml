services:
  # --------------------------------------------------------
  # 1. Banco de Dados Neo4j (Grafo + Vetores)
  # --------------------------------------------------------
  neo4j:
    image: neo4j:5.26.0-community
    container_name: neo4j
    ports:
      - "7474:7474" # Interface Web (Neo4j Browser)
      - "7687:7687" # Porta Bolt (Conexão Spring Boot)
    environment:
      - NEO4J_AUTH=neo4j/${PASSWD_NEO4J}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - application

  # --------------------------------------------------------
  # 2. Backend Spring Boot (Java 21)
  # --------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      PASSWD_NEO4J: ${PASSWD_NEO4J}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_API_CLIENT_ID: ${GOOGLE_API_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      PYTHON_RUNNER_URL: http://python-runner:8081
      FILE_STORAGE_ROOT: /app/data/files
    volumes:
      - file_data:/app/data/files
    depends_on:
      neo4j:
        condition: service_healthy
      python-runner:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - application
      - runner

  # --------------------------------------------------------
  # 3. Frontend Angular (Nginx)
  # --------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    environment:
      GOOGLE_API_CLIENT_ID: ${GOOGLE_API_CLIENT_ID}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - application

  # --------------------------------------------------------
  # 4. Runner Python isolado para ferramentas da IA
  # --------------------------------------------------------
  python-runner:
    build:
      context: ./python-runner
      dockerfile: Dockerfile
    container_name: python-runner
    ports:
      - "127.0.0.1:8081:8081"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,nosuid,size=1m
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - runner

volumes:
  neo4j_data:
  neo4j_logs:
  file_data:

networks:
  application:
  runner:
