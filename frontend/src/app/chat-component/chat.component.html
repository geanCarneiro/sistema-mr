<div class="workspace">
  <app-chat-conversation
    [messages]="messages()"
    [loading]="loading()"
    [processingMessage]="processingMessage()"
    [userName]="userData?.nome ?? null"
    [subjects]="subjects()"
    [activeSubjectId]="activeSubjectId()"
    [selectedFileIds]="selectedFileIds()"
    [includeRelatedFiles]="includeRelatedFiles()"
    (submit)="enviar($event)"
    (subjectSelected)="selecionarAssunto($event)"
    (reloadHistory)="recarregarChat()"
    (clearSelection)="limparSelecao()"
    (logout)="logout()"
  />

  <app-attachment-panel
    [files]="files()"
    [uploading]="uploading()"
    [uploadError]="uploadError()"
    [selectedFileIds]="selectedFileIds()"
    [includeRelatedFiles]="includeRelatedFiles()"
    [selectionError]="selectionError()"
    (filesSelected)="selecionarArquivos($event)"
    (fileToggled)="alternarAnexo($event)"
    (relatedFilesChanged)="definirBuscaRelacionada($event)"
    (fileDownloaded)="baixarArquivo($event)"
    (fileRemoved)="removerArquivo($event)"
    (fileRetried)="reprocessarArquivo($event)"
    (privacyReviewRequested)="solicitarRevisaoPrivacidade($event)"
  />
</div>
